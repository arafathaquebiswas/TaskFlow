# Project-wide Gradle settings.
# For more details on how to configure your build environment visit:
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use AndroidX standard libraries across all package dependencies
android.useAndroidX=true

# Disable Jetifier because TaskFlow has zero legacy support or obsolete dependencies, maximizing compilation speed!
android.enableJetifier=false

# When configured, Gradle will run in incubating parallel mode to compile modules in parallel.
org.gradle.parallel=true

# Kotlin code style for this project: "official"
kotlin.code.style=official

# Enables namespacing of each library's R class to reduce APK size.
android.nonTransitiveRClass=true

# Enable local build caches to speed up incremental builds.
org.gradle.caching=true

# Enable configuration caching to bypass configuration phase when build files have not changed.
org.gradle.configuration-cache=true

# Set the maximum number of workers to 4 to avoid overloading the container.
org.gradle.workers.max=4

# Set the Kotlin compiler execution strategy to in-process to prevent daemon connection drops.
kotlin.compiler.execution.strategy=in-process
